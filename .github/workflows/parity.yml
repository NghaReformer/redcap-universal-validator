name: parity

on:
  push:
  pull_request:

# Nothing in CI writes to the repository.
permissions:
  contents: read

jobs:
  js-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: JS engine vs fixture (compute + normalize + scheme_ops)
        run: node tests/parity_js.cjs
      - name: Pooled fixture is up to date
        run: |
          node tests/gen_pooled_fixture.cjs
          git diff --exit-code tests/pooled_fixture.json \
            || (echo "pooled_fixture.json is stale — re-run node tests/gen_pooled_fixture.cjs and commit"; exit 1)
      - name: JS pooled parser vs fixture
        run: node tests/pooled_js.cjs
      - name: JS pooled chip rendering (severity colors + marks)
        run: node tests/pooled_dom_js.cjs
      - name: JS risky-pattern heuristic
        run: node tests/risky_js.cjs
      - name: JS "when" condition evaluator vs fixture
        run: node tests/when_js.cjs
      - name: JS exact-decimal comparator vs fixture (2^53, 400-digit, long fractions)
        run: node tests/numeric_js.cjs
      - name: JS "when" fuzz fixture is up to date
        run: |
          node tests/gen_when_fuzz.cjs
          git diff --exit-code tests/when_fuzz.json \
            || (echo "when_fuzz.json is stale — re-run node tests/gen_when_fuzz.cjs and commit"; exit 1)
      - name: JS "when" gate DOM contract (live refs, folded constants, fail-open)
        run: node tests/when_dom_js.cjs
      - name: JS branched validation DOM contract (active branch, else, conflict)
        run: node tests/branch_dom_js.cjs
      - name: JS constraint (@UVASSERT) DOM contract (assert test, compose, branches)
        run: node tests/constraint_dom_js.cjs
      - name: JS required (@UVREQUIRED) DOM contract (blank, when-gate, compose)
        run: node tests/required_dom_js.cjs
      - name: JS unique (@UVUNIQUE) DOM contract (transport, fail-open, cache)
        run: node tests/unique_dom_js.cjs
      - name: JS choices (@UVCHOICES) DOM contract (filter, stale-kept, fixture)
        run: node tests/choices_dom_js.cjs
      - name: JS config-error notice
        run: node tests/config_notice_js.cjs
      - name: JS dispatcher config-error routing
        run: node tests/dispatch_notice_js.cjs
      - name: JS field DOM contract (a11y, debounce, survey muting, readonly)
        run: node tests/a11y_dom_js.cjs
      - name: Algorithm set is complete (fixture == JS registry == dropdown)
        run: node tests/algorithm_coverage_js.cjs
      - name: Derivation tracers match compute() on every fixture row
        run: node tests/explain_js.cjs

  php-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the declared php-version-min (7.4) through the runtime the fleet
        # actually runs, so the floor is exercised rather than declared - and so
        # is the top. 8.4 is here because the CHPR servers run it: the v1.8.7
        # deployment verification reported PHP 8.4 while this matrix stopped at
        # 8.3, so the one runtime in production was the one nothing tested.
        # 8.4 also turns implicitly nullable parameters into deprecations, which
        # become errors in PHP 9.
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, ctype
      - name: PHP syntax check
        run: |
          php -l php/CheckCharacter.php
          php -l php/AnnotationRules.php
          php -l php/Logic.php
          php -l php/Branching.php
          php -l php/ScanPageView.php
          php -l php/FindingSink.php
          php -l php/ScanCapabilities.php
          php -l php/ScanDimensions.php
          php -l php/MessageCatalog.php
          php -l php/ScanColumns.php
          php -l php/Scan/Schema.php
          php -l php/Scan/ScanStore.php
          php -l php/Scan/ScanOutcome.php
          php -l php/Scan/ScanAuthorization.php
          php -l php/Scan/ScanPolicy.php
          php -l php/Scan/Hmac.php
          php -l php/Scan/ScanDb.php
          php -l php/Scan/SqlScanStore.php
          php -l php/Scan/ArrayScanStore.php
          php -l php/Scan/WorkerSlots.php
          php -l php/Scan/ScanRetention.php
          php -l php/Scan/ScanPhase.php
          php -l php/Scan/ScanPlanner.php
          php -l php/Scan/RecordManifestSource.php
          php -l php/Scan/SourceFence.php
          php -l php/Scan/WorkBudget.php
          php -l php/Scan/ScanWorker.php
          php -l php/Scan/UniqueFinalizer.php
          php -l php/Scan/CatchUp.php
          php -l php/Scan/RollupBuilder.php
          php -l php/Scan/ScanPromotion.php
          php -l UniversalValidator.php
          php -l pages/scan.php
          php -l pages/export.php
      - name: PHP port vs fixture (compute + normalize + scheme_ops)
        run: php tests/parity_php.php
      - name: PHP pooled parser vs fixture
        run: php tests/pooled_php.php
      - name: PHP risky-pattern heuristic + server behavior
        run: php tests/risky_php.php
      - name: PHP "when" condition evaluator vs fixture
        run: php tests/when_php.php
      - name: PHP exact-decimal comparator vs fixture (2^53, 400-digit, long fractions)
        run: php tests/numeric_php.php
      - name: PHP branch resolver (shared-field rules)
        run: php tests/branching_php.php
      - name: PHP "when" engine vs the JS twin (differential fuzz)
        run: php tests/when_fuzz_php.php
      - name: PHP @UVALIDATE annotation parser
        run: php tests/annotation_php.php
      - name: PHP @UVCHOICES choices parser + branching
        run: php tests/choices_php.php
      - name: PHP server-side audit (redcap_save_record) path
        run: php tests/hook_php.php
      - name: PHP cross-form @UVASSERT (entitled bake, deferred fallback, fail-closed)
        run: php tests/crossform_php.php
      - name: PHP cross-form red-team (checkboxes, branches, nesting, repeats)
        run: php tests/crossform_adversarial_php.php
      - name: PHP cross-form resolution (cross-repeat, failed read, off-event, reverse deps)
        run: php tests/crossform_resolution_php.php
      - name: PHP rule hosting (where a rule runs; stale gates; what a scan may certify)
        run: php tests/hosting_php.php
      - name: PHP validation scan page (rights fail-open, unresolvable DAG, CSV, table cap)
        run: php tests/scan_page_php.php
      - name: Scan capabilities (what an installation may claim)
        run: php tests/scan_capabilities_php.php
      - name: Durable scan schema (allowlist, idempotency, fail-closed migration)
        run: php tests/scan_schema_php.php
      - name: Durable scan security (permission matrix, outcome table, HMAC, policy)
        run: php tests/scan_security_php.php
      - name: Durable scan store contract (in-memory; the SQL store runs it in scan-database)
        run: php tests/scan_store_php.php
      - name: Durable scan worker (phases, stable reads, catch-up, promotion)
        run: php tests/scan_worker_php.php
      - name: Algorithm set is complete (fixture == PHP engine == allow-list == dropdown)
        run: php tests/algorithm_coverage_php.php

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and verify the release-shaped archive
        run: |
          set -e
          VERSION=$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)
          test -n "$VERSION" || { echo "could not read the version from CHANGELOG.md"; exit 1; }
          DIR="universal_validator_v${VERSION}"
          git archive --prefix="${DIR}/" -o "${DIR}.zip" HEAD
          unzip -q "${DIR}.zip" -d /tmp/pkg
          cd "/tmp/pkg/${DIR}"
          echo "--- package contents ---"
          find . -type f | sort
          for f in config.json UniversalValidator.php README.md LICENSE js/engine.js php/CheckCharacter.php php/AnnotationRules.php php/Logic.php php/Branching.php php/ScanPageView.php php/FindingSink.php php/ScanCapabilities.php php/ScanDimensions.php php/MessageCatalog.php php/ScanColumns.php php/Scan/Schema.php php/Scan/ScanStore.php php/Scan/ScanOutcome.php php/Scan/ScanAuthorization.php php/Scan/ScanPolicy.php php/Scan/Hmac.php php/Scan/ScanDb.php php/Scan/SqlScanStore.php php/Scan/ArrayScanStore.php php/Scan/WorkerSlots.php php/Scan/ScanRetention.php php/Scan/ScanPhase.php php/Scan/ScanPlanner.php php/Scan/RecordManifestSource.php php/Scan/SourceFence.php php/Scan/WorkBudget.php php/Scan/ScanWorker.php php/Scan/UniqueFinalizer.php php/Scan/CatchUp.php php/Scan/RollupBuilder.php php/Scan/ScanPromotion.php php/messages/catalog.json pages/scan.php pages/export.php; do
            test -f "$f" || { echo "MISSING required file: $f"; exit 1; }
          done
          for d in .github reports tools; do
            test ! -e "$d" || { echo "development-only path shipped in the package: $d"; exit 1; }
          done
          python3 -m json.tool config.json > /dev/null
          grep -qF 'INSPIRE\\UniversalValidator' config.json \
            || { echo "config.json namespace mismatch"; exit 1; }
          grep -qF 'namespace INSPIRE\UniversalValidator;' UniversalValidator.php \
            || { echo "module class namespace mismatch"; exit 1; }
          echo "package ${DIR}.zip OK"

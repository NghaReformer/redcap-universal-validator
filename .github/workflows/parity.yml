name: parity

on:
  push:
  pull_request:

# Nothing in CI writes to the repository.
permissions:
  contents: read

jobs:
  js-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: JS engine vs fixture (compute + normalize + scheme_ops)
        run: node tests/parity_js.cjs
      - name: Mode registry and growth-outputs blocks in js/engine.js match php/modes.json and php/growth_outputs.json
        run: node tests/gen_mode_registry.cjs --check
      - name: Pooled fixture is up to date
        run: |
          node tests/gen_pooled_fixture.cjs
          git diff --exit-code tests/pooled_fixture.json \
            || (echo "pooled_fixture.json is stale — re-run node tests/gen_pooled_fixture.cjs and commit"; exit 1)
      - name: JS pooled parser vs fixture
        run: node tests/pooled_js.cjs
      - name: JS pooled chip rendering (severity colors + marks)
        run: node tests/pooled_dom_js.cjs
      - name: JS risky-pattern heuristic
        run: node tests/risky_js.cjs
      - name: Every suite is named by a workflow, and no run step folds its lines into one command
        run: node tests/ci_workflow_js.cjs
      - name: Release tags are plain vX.Y.Z, match CHANGELOG.md, go up and avoid folder numbers in use; docs/INSTALL.md lists those numbers and README.md names no other current version
        run: node tests/release_version_js.cjs
      - name: Qualified reference parser and deferral contracts
        run: |
          node tests/qualified_js.cjs
          node tests/temporal_logic_js.cjs
          node tests/exact_decimal_js.cjs
          node tests/deferral_dom_js.cjs
      - name: JS "when" condition evaluator vs fixture
        run: node tests/when_js.cjs
      - name: JS exact-decimal comparator vs fixture (2^53, 400-digit, long fractions)
        run: node tests/numeric_js.cjs
      - name: JS "when" fuzz fixture is up to date
        run: |
          node tests/gen_when_fuzz.cjs
          git diff --exit-code tests/when_fuzz.json \
            || (echo "when_fuzz.json is stale — re-run node tests/gen_when_fuzz.cjs and commit"; exit 1)
      - name: JS "when" gate DOM contract (live refs, folded constants, fail-open)
        run: node tests/when_dom_js.cjs
      - name: JS branched validation DOM contract (active branch, else, conflict)
        run: node tests/branch_dom_js.cjs
      - name: JS constraint (@UVASSERT) DOM contract (assert test, compose, branches)
        run: node tests/constraint_dom_js.cjs
      - name: JS required (@UVREQUIRED) DOM contract (blank, when-gate, compose)
        run: node tests/required_dom_js.cjs
      - name: JS unique (@UVUNIQUE) DOM contract (transport, fail-open, cache)
        run: node tests/unique_dom_js.cjs
      - name: JS choices (@UVCHOICES) DOM contract (filter, stale-kept, fixture)
        run: node tests/choices_dom_js.cjs
      - name: JS window (@UVWINDOW) verdict vs fixture, its DOM contract (server clock, snapshot, midnight), and the page's glue vs the server's
        run: |
          node tests/window_js.cjs
          node tests/window_dom_js.cjs
          node tests/window_glue_dom_js.cjs
      - name: JS exists (@UVEXISTS) DOM contract (asks on change, could-not-check never blocks, cache)
        run: node tests/exists_dom_js.cjs
      - name: JS @UVEXISTS "return" DOM contract (fills on found, empties on not-found, leaves on unknown, quiet page-open fill)
        run: node tests/exists_return_dom_js.cjs
      - name: JS @UVEXISTS "where" DOM contract (filtered line, whereMessage and its languages, surveys, save held)
        run: node tests/exists_where_dom_js.cjs
      - name: JS lookup comparison (@UVEXISTS/@UVUNIQUE letter case and numbers) vs fixture
        run: node tests/lookup_js.cjs
      - name: JS range (@UVRANGE) verdict vs fixture, and its DOM contract (tiers, comma decimals, calc never blocks)
        run: |
          node tests/range_js.cjs
          node tests/range_dom_js.cjs
      - name: JS delta (@UVDELTA) verdict vs fixture, its DOM contract (live vs blocks, saved vs and calc never block, two comparisons, typing, scripted values), and the live run sheet's notes replayed through the engine
        run: |
          node tests/delta_js.cjs
          node tests/delta_dom_js.cjs
          node tests/delta_live_twin_js.cjs
      - name: JS write-once (@UVWRITEONCE) page lock (read-only, disabled, a change undone, other modes never hold the save), and the live run sheet's clicks replayed through the engine
        run: |
          node tests/writeonce_dom_js.cjs
          node tests/writeonce_live_twin_js.cjs
      - name: JS reason (@UVJUSTIFY) given vs fixture, its DOM contract (a reason releases the modes it stands for, the alert and dialog name the reason field, the note, no note under a field that cannot hold the save, write-once and unique not released), and the live run sheet's clicks replayed through the engine
        run: |
          node tests/justify_js.cjs
          node tests/justify_dom_js.cjs
          node tests/justify_live_twin_js.cjs
      - name: JS silent value changes (calc, slider, Today button are judged) and the save dialog's field labels
        run: node tests/silent_change_dom_js.cjs
      - name: JS under Multi-Language Management (hidden choices translated, dialog labels read live, survey labels)
        run: node tests/mlm_dom_js.cjs
      - name: JS rule messages in the Multi-Language Management language (string messages unchanged, a switch asks nothing)
        run: node tests/mlm_messages_dom_js.cjs
      - name: JS growth references (@UVRANGE z-scores vs fixture, WHO golden, R pnorm/qnorm, parity hashes, DOM contract, returned values, growth chart and page table)
        run: |
          node tests/growth_js.cjs
          node tests/growth_dom_js.cjs
          node tests/growth_return_dom_js.cjs
          node tests/growth_chart_dom_js.cjs
          node tests/growth_chart_gaps_dom_js.cjs
      - name: js/engine.min.js is what the pinned terser makes of js/engine.js, and every browser suite passes on it (PRF-7)
        run: |
          node tools/build_engine_min.cjs --check
          node tests/engine_min_js.cjs
      - name: JS Missing Data Codes (a coded field is not judged in any mode; @UVREQUIRED counts it)
        run: node tests/missing_codes_dom_js.cjs
      - name: JS multi-format rules (alternates - single verdict, guidance, mixed pool)
        run: node tests/alternates_dom_js.cjs
      - name: JS documented outcomes (expect blocks in the example docs)
        run: node tests/docs_examples_js.cjs
      - name: JS config-error notice
        run: node tests/config_notice_js.cjs
      - name: JS dispatcher config-error routing
        run: node tests/dispatch_notice_js.cjs
      - name: JS field DOM contract (a11y, debounce, survey muting, readonly)
        run: node tests/a11y_dom_js.cjs
      - name: JS a field named "constructor" behaves like any other, in every mode
        run: node tests/prototype_names_dom_js.cjs
      - name: JS save guard in front of REDCap's dataEntrySubmit (Enter key, scripts)
        run: node tests/save_guard_enter_dom_js.cjs
      - name: JS browser half of the value parity rows (trim, non-ASCII, regex dialect, length)
        run: node tests/value_parity_dom_js.cjs
      - name: Algorithm set is complete (fixture == JS registry == dropdown)
        run: node tests/algorithm_coverage_js.cjs
      - name: Derivation tracers match compute() on every fixture row
        run: node tests/explain_js.cjs
      - name: Durable scan client (progress loop, refusals, backoff)
        run: node tests/scan_client_js.cjs
      - name: Durable scan findings panel (keyset pages, filters, refusals, marks)
        run: node tests/scan_panel_js.cjs
      - name: JS message parity fixture (the form's sentence beside the report's)
        run: node tests/messages_fixture_js.cjs

  php-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the declared php-version-min (7.4) through the runtime the fleet
        # actually runs, so the floor is exercised rather than declared - and so
        # is the top. 8.4 is here because the CHPR servers run it: the v1.8.7
        # deployment verification reported PHP 8.4 while this matrix stopped at
        # 8.3, so the one runtime in production was the one nothing tested.
        # 8.4 also turns implicitly nullable parameters into deprecations, which
        # become errors in PHP 9.
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '${{ matrix.php }}'
          # intl: Logic::roleKey puts role names in composed form only where it is loaded
          extensions: mbstring, ctype, intl
      # ubuntu-latest is Ubuntu 26.04, which keeps the backward-compatible
      # time zone names (Asia/Calcutta, US/Eastern, Europe/Kiev) in a separate
      # package, tzdata-legacy, as Debian 13 does; PHP here reads the system's
      # time zone database. The first step runs before that package is
      # installed, so the old names go through php/timezone_links.json, as on
      # such a server. Every later step runs with the package.
      - name: Time zone names on a server without tzdata-legacy
        run: php tests/clock_zones_php.php
      - name: Install tzdata-legacy (the backward-compatible time zone names)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tzdata-legacy
      - name: Qualified resolution, matching, exact aggregates and typed dates
        run: |
          php tests/qualified_php.php
          php tests/binding_php.php
          php tests/temporal_value_php.php
          php tests/temporal_logic_php.php
          php tests/temporal_integration_php.php
          php tests/temporal_adversarial_php.php
          php tests/collection_index_php.php
          php tests/docs_examples_php.php
          python3 tests/temporal_mutations.py
      # 28 defects of @UVEXISTS "where" and of reading a condition whole, each
      # applied to a disposable copy and required to fail the suite named
      # beside it. About 45 seconds; Node is on the runner image.
      - name: '@UVEXISTS where mutations'
        run: PHP_BIN=php python3 tests/exists_where_mutations.py
      - name: PHP syntax check
        run: |
          php -l php/CheckCharacter.php
          php -l php/AnnotationRules.php
          php -l php/Logic.php
          php -l php/ReferenceBudget.php
          php -l php/ProjectShape.php
          php -l php/AddressResolver.php
          php -l php/ExactDecimal.php
          php -l php/CollectionIndex.php
          php -l php/TemporalValue.php
          php -l php/TemporalLogic.php
          php -l php/TemporalRules.php
          php -l php/TemporalMetadata.php
          php -l php/TemporalIntegration.php
          php -l php/Branching.php
          php -l php/ModeRegistry.php
          php -l php/GrowthReference.php
          php -l php/GrowthOutputs.php
          php -l php/GrowthCurve.php
          php -l php/ReturnedValues.php
          php -l php/ValueStamps.php
          php -l php/ClockZones.php
          php -l data/references/convert.php
          php -l php/ScanPageView.php
          php -l php/FindingSink.php
          php -l php/ScanCapabilities.php
          php -l php/ScanDimensions.php
          php -l php/MessageCatalog.php
          php -l php/ScanColumns.php
          php -l php/Scan/Schema.php
          php -l php/Scan/ScanStore.php
          php -l php/Scan/ScanOutcome.php
          php -l php/Scan/ScanAuthorization.php
          php -l php/Scan/ScanPolicy.php
          php -l php/Scan/Hmac.php
          php -l php/Scan/ScanDb.php
          php -l php/Scan/DbError.php
          php -l php/Scan/ScanStoreUnavailable.php
          php -l php/Scan/SqlScanStore.php
          php -l tests/support/ArrayScanStore.php
          php -l php/Scan/WorkerSlots.php
          php -l php/Scan/ScanRetention.php
          php -l php/Scan/ScanPhase.php
          php -l php/Scan/ScanPlanner.php
          php -l php/Scan/RecordManifestSource.php
          php -l php/Scan/FieldValues.php
          php -l php/Scan/SourceFence.php
          php -l php/Scan/WorkBudget.php
          php -l php/Scan/ScanWorker.php
          php -l php/Scan/UniqueFinalizer.php
          php -l php/Scan/CatchUp.php
          php -l php/Scan/RollupBuilder.php
          php -l php/Scan/ScanPromotion.php
          php -l php/Scan/ReasonCode.php
          php -l php/Scan/FindingRowMapper.php
          php -l php/Scan/ScanReport.php
          php -l php/Scan/ScanService.php
          php -l UniversalValidator.php
          php -l pages/scan.php
          php -l pages/export.php
      - name: PHP port vs fixture (compute + normalize + scheme_ops)
        run: php tests/parity_php.php
      - name: PHP pooled parser vs fixture
        run: php tests/pooled_php.php
      - name: PHP risky-pattern heuristic + server behavior
        run: php tests/risky_php.php
      - name: PHP "when" condition evaluator vs fixture
        run: php tests/when_php.php
      - name: PHP exact-decimal comparator vs fixture (2^53, 400-digit, long fractions)
        run: php tests/numeric_php.php
      - name: PHP branch resolver (shared-field rules)
        run: php tests/branching_php.php
      - name: PHP mode registry (frozen maps, coverage, malformed file)
        run: php tests/registry_php.php
      - name: PHP "when" engine vs the JS twin (differential fuzz)
        run: php tests/when_fuzz_php.php
      - name: PHP @UVALIDATE annotation parser
        run: php tests/annotation_php.php
      - name: PHP rule message as a language map (grammar, refusals, string messages unchanged)
        run: php tests/message_i18n_php.php
      - name: PHP message parity fixture (the report's sentence beside the form's)
        run: php tests/messages_fixture_php.php
      - name: PHP @UVCHOICES choices parser + branching
        run: php tests/choices_php.php
      - name: PHP @UVWINDOW verdict vs fixture, hooks, fold, audit and scan clock
        run: |
          php tests/window_php.php
          php tests/window_module_php.php
          php tests/window_glue_php.php
          php tests/value_stamps_php.php
          php tests/clock_zones_php.php
      - name: PHP @UVEXISTS grammar, hooks, endpoint (rights, throttle, surveys), audit and scan index
        run: php tests/exists_php.php
      - name: PHP @UVEXISTS in another project (consent, rights there, probe log, budgets, audit, scan)
        run: php tests/exists_cross_php.php
      - name: PHP @UVEXISTS "return" (grammar, setup checks, endpoint values, save write, rights, another project)
        run: php tests/exists_return_php.php
      - name: PHP @UVEXISTS "where" (grammar, setup checks, evaluation, confirming read, filtered outcome, audit, scan)
        run: php tests/exists_where_php.php
      - name: PHP repeat map read from the Project object or the static method ("return"/"where" on REDCap 17)
        run: php tests/repeat_metadata_php.php
      - name: PHP lookup comparison (@UVEXISTS/@UVUNIQUE letter case and numbers) vs fixture
        run: php tests/lookup_php.php
      - name: PHP @UVRANGE verdict vs fixture, grammar, field hook, branches, audit and scan
        run: |
          php tests/range_php.php
          php tests/range_module_php.php
      - name: PHP @UVDELTA verdict vs fixture, budget, grammar, hooks, page, audit (events, instances), scan, the live run sheet's answers, and 265 mutations the suites must kill
        run: |
          php tests/delta_php.php
          php tests/delta_module_php.php
          php tests/delta_live_twin_php.php
          python3 tests/delta_mutations.py
      - name: PHP @UVWRITEONCE verdict vs fixture, the log reader, grammar, roles, hooks, page, audit, scan, the live run sheet's answers, and 255 mutations the suites must kill (the 12 of the SQL run where UV_DB_HOST names a server; the 2 of the composed form of role names run here, with intl)
        run: |
          php tests/writeonce_php.php
          php tests/writeonce_module_php.php
          php tests/writeonce_live_twin_php.php
          python3 tests/writeonce_mutations.py
      - name: PHP @UVJUSTIFY reason given vs fixture, grammar, pairing with the rules it stands for, hooks, audit, legacy and durable scan, the live run sheet's answers, and 91 mutations the suites must kill (the 7 of the SQL run where UV_DB_HOST names a server)
        run: |
          php tests/justify_php.php
          php tests/justify_module_php.php
          php tests/justify_live_twin_php.php
          python3 tests/justify_mutations.py
      - name: PHP growth references (z-scores vs fixture, WHO golden, R pnorm/qnorm, parity hashes, output catalog, extra folder, grammar, hooks, page, audit, scan, returned values, chart curves and their error bound, "show" grammar, payload and cap, converter)
        run: |
          php tests/growth_php.php
          php tests/growth_outputs_php.php
          php tests/growth_module_php.php
          php tests/growth_return_module_php.php
          php tests/growth_curve_php.php
          php tests/growth_chart_module_php.php
          php tests/growth_chart_gaps_module_php.php
          php tests/convert_php.php
      - name: Each bundled growth table's rows script (js/growth) matches the table (PRF-7)
        run: php tools/build_growth_rows.php --check
      - name: PHP Missing Data Codes (audit, scan, endpoints and page skip coded fields)
        run: php tests/missing_codes_php.php
      - name: PHP server-side audit (redcap_save_record) path
        run: php tests/hook_php.php
      - name: PHP server half of the value parity rows (trim, non-ASCII, regex dialect, length)

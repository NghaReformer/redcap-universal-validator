  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Build and verify the release-shaped archive
        run: |
          set -e
          # A tag must be a plain vX.Y.Z equal to the first CHANGELOG.md version,
          # above every earlier one and not a folder number a server already uses
          # (tools/release_version.cjs says why).
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION=$(node tools/release_version.cjs --tag "${GITHUB_REF_NAME}")
          else
            VERSION=$(node tools/release_version.cjs)
          fi
          test -n "$VERSION" || { echo "could not read the version from CHANGELOG.md"; exit 1; }
          DIR="universal_validator_v${VERSION}"
          git archive --prefix="${DIR}/" -o "${DIR}.zip" HEAD
          unzip -q "${DIR}.zip" -d /tmp/pkg
          cd "/tmp/pkg/${DIR}"
          echo "--- package contents ---"
          find . -type f | sort
          for f in config.json UniversalValidator.php README.md CHANGELOG.md LICENSE js/engine.js php/ReferenceBudget.php php/ProjectShape.php php/AddressResolver.php php/ExactDecimal.php php/CollectionIndex.php php/TemporalValue.php php/TemporalLogic.php php/TemporalRules.php php/TemporalMetadata.php php/TemporalIntegration.php php/CheckCharacter.php php/AnnotationRules.php php/Logic.php php/Branching.php php/ModeRegistry.php php/modes.json php/ScanPageView.php php/FindingSink.php php/ScanCapabilities.php php/ScanDimensions.php php/MessageCatalog.php php/ScanColumns.php php/Scan/Schema.php php/Scan/ScanStore.php php/Scan/ScanOutcome.php php/Scan/ScanAuthorization.php php/Scan/ScanPolicy.php php/Scan/Hmac.php php/Scan/ScanDb.php php/Scan/DbError.php php/Scan/ScanStoreUnavailable.php php/Scan/SqlScanStore.php php/Scan/WorkerSlots.php php/Scan/ScanRetention.php php/Scan/ScanPhase.php php/Scan/ScanPlanner.php php/Scan/RecordManifestSource.php php/Scan/FieldValues.php php/Scan/LookupIndex.php php/Scan/SourceFence.php php/Scan/WorkBudget.php php/Scan/ScanWorker.php php/Scan/UniqueFinalizer.php php/Scan/CatchUp.php php/Scan/RollupBuilder.php php/Scan/ScanPromotion.php php/Scan/ReasonCode.php php/Scan/ScanService.php php/Scan/ScanMaintenance.php php/Scan/FindingRowMapper.php php/Scan/ScanReport.php php/Faults.php js/scan.js php/messages/catalog.json pages/scan.php pages/export.php php/GrowthReference.php php/GrowthOutputs.php php/GrowthCurve.php php/growth_outputs.json php/ReturnedValues.php php/ValueStamps.php php/ClockZones.php php/timezone_links.json js/engine.min.js data/references/index.json data/references/README.md data/references/convert.php data/references/who/LICENSE data/references/who/README.md; do
            test -f "$f" || { echo "MISSING required file: $f"; exit 1; }
          done
          # Every bundled growth table ships, byte for byte as index.json pins it.
          python3 - <<'PY'
          import hashlib, json, sys
          idx = json.load(open('data/references/index.json', encoding='utf-8'))
          for rid, e in idx['references'].items():
              raw = open('data/references/' + e['file'], 'rb').read()
              if hashlib.sha256(raw).hexdigest() != e['sha256']:
                  sys.exit('growth table of ' + rid + ' does not match its sha256 in the package')
          print('growth tables OK:', len(idx['references']))
          # ...and each one's rows script, which a page names by the table's hash (PRF-7)
          for rid, e in idx['references'].items():
              js = 'js/growth/' + e['sha256'][:16] + '.js'
              try:
                  text = open(js, encoding='utf-8').read()
              except OSError:
                  sys.exit('the rows script of ' + rid + ' is missing from the package: ' + js)
              if '["' + e['sha256'] + '"]' not in text:
                  sys.exit('the rows script of ' + rid + ' files its rows under another hash: ' + js)
          print('growth rows scripts OK')
          # the minified engine names the engine.js shipped beside it (UniversalValidator::servedEngine)
          import zlib
          crc = '%08x' % (zlib.crc32(open('js/engine.js', 'rb').read()) & 0xffffffff)
          if (' crc32b ' + crc + '. ') not in open('js/engine.min.js', encoding='utf-8').readline():
              sys.exit('js/engine.min.js does not name the js/engine.js in the package')
          print('js/engine.min.js OK')
          PY
          for d in .github reports tools site CLAUDE.md .graphifyignore; do
            test ! -e "$d" || { echo "development-only path shipped in the package: $d"; exit 1; }
          done
          # Plans, PDFs and temporal scripts at the root are development files too.
          if ls PLAN-*.md *.pdf *temporal* 2>/dev/null | grep -q .; then
            echo "development-only file shipped in the package:"; ls PLAN-*.md *.pdf *temporal* 2>/dev/null; exit 1
          fi
          python3 -m json.tool config.json > /dev/null
          grep -qF 'INSPIRE\\UniversalValidator' config.json \
            || { echo "config.json namespace mismatch"; exit 1; }
          grep -qF 'namespace INSPIRE\UniversalValidator;' UniversalValidator.php \
            || { echo "module class namespace mismatch"; exit 1; }
          echo "package ${DIR}.zip OK"

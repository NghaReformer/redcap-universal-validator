# The invariants the mocked suites cannot reach.
#
# tests/mysql/run.php asserts what a SECOND connection observes: the one-active
# -run slot, the installation-wide worker semaphore, lease-epoch fencing,
# cancellation beating an in-flight worker, and one active version per finding
# identity. None of that is decidable against a mock, and this module has already
# shipped a control that passed every mocked test and did nothing in production.
#
# Four services, because the guarantees differ: MySQL 5.7 is the oldest REDCap
# supports, MySQL 8.0 changes the default collation and the optimiser, and the
# MariaDB line diverges on both UNIQUE-with-NULL edge cases and lock timeouts.
# A green tick on one of them is not a green tick on the fleet.
name: scan database

on:
  push:
    paths:
      - 'php/Scan/**'
      - 'tests/mysql/**'
      - '.github/workflows/scan-database.yml'
  pull_request:
    paths:
      - 'php/Scan/**'
      - 'tests/mysql/**'
      - '.github/workflows/scan-database.yml'
  workflow_dispatch:

jobs:
  store:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            image: mysql:5.7
          - db: mysql
            image: mysql:8.0
          - db: mariadb
            image: mariadb:10.5
          - db: mariadb
            image: mariadb:10.11
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: uvtest
          MYSQL_DATABASE: uv_test
        ports:
          - 3306:3306
        # The job must not start before the server accepts connections, or the
        # first failure is a connection refusal wearing a test's name.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -puvtest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: mbstring, ctype, mysqli

      - name: Initialise the schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -puvtest < tests/mysql/bootstrap.sql

      # The migration is what is under test, so it is NOT pre-applied. run.php
      # drops the module's tables, migrates from nothing, and asserts on the
      # result - a fixture that pre-created them would test MySQL, not us.
      - name: Store and concurrency invariants
        env:
          UV_DB_HOST: 127.0.0.1
          UV_DB_PORT: '3306'
          UV_DB_USER: root
          UV_DB_PASS: uvtest
          UV_DB_NAME: uv_test
        run: php tests/mysql/run.php

      # READ COMMITTED explicitly, as well as the server default. The slot and
      # lease predicates must hold under both; a design that only works under
      # REPEATABLE READ is a design that breaks on a site that tuned its server.
      - name: Same invariants under READ COMMITTED
        env:
          UV_DB_HOST: 127.0.0.1
          UV_DB_PORT: '3306'
          UV_DB_USER: root
          UV_DB_PASS: uvtest
          UV_DB_NAME: uv_test
          UV_DB_ISOLATION: 'READ COMMITTED'
        run: php tests/mysql/run.php

      # Nothing may remain: run.php drops both its own uv_ tables and the
      # REDCap-shaped stand-ins the record-walk tests create. A leftover table
      # means a test path exited early, and the next run would inherit its rows.
      - name: Nothing of ours is left behind
        run: |
          LEFT=$(mysql -h 127.0.0.1 -P 3306 -uroot -puvtest -N -B -e \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='uv_test' AND (table_name LIKE 'uv\\_%' OR table_name LIKE 'redcap\\_%')")
          test "$LEFT" = "0" || { echo "left $LEFT table(s) behind"; exit 1; }
